<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf1f8"/>
      <stop offset="50%" stop-color="#d6e4f0"/>
      <stop offset="100%" stop-color="#bed3e6"/>
    </linearGradient>
    <linearGradient id="skinN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3cfb3"/>
      <stop offset="100%" stop-color="#e3b28c"/>
    </linearGradient>
    <linearGradient id="hairN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c353d"/>
      <stop offset="100%" stop-color="#181e24"/>
    </linearGradient>
    <linearGradient id="suitN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="100%" stop-color="#0f233f"/>
    </linearGradient>
    <linearGradient id="tieN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b2c2c"/>
      <stop offset="100%" stop-color="#742a2a"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="300" height="400" fill="url(#bgN)"/>
  <circle cx="150" cy="175" r="115" fill="#ffffff" opacity="0.45"/>

  <!-- Neck -->
  <path d="M122 222 L122 286 L178 286 L178 222 Z" fill="url(#skinN)"/>
  <path d="M122 242 Q150 262 178 242 L178 258 Q150 276 122 258 Z" fill="#ce9870" opacity="0.55"/>

  <!-- Suit Shoulders -->
  <path d="M26 400 C32 304, 78 272, 122 268 L150 365 L178 268 C222 272, 268 304, 274 400 Z" fill="url(#suitN)"/>

  <!-- Crisp White Shirt & Collar -->
  <path d="M118 268 L150 372 L182 268 Z" fill="#ffffff"/>
  <polygon points="120,264 143,296 128,312 114,274" fill="#f1f5f9"/>
  <polygon points="180,264 157,296 172,312 186,274" fill="#f1f5f9"/>

  <!-- Tie -->
  <polygon points="143,292 157,292 161,306 150,314 139,306" fill="url(#tieN)"/>
  <polygon points="143,310 157,310 163,366 150,382 137,366" fill="url(#tieN)"/>
  <line x1="142" y1="326" x2="158" y2="334" stroke="#f6e05e" stroke-width="2" opacity="0.7"/>
  <line x1="140" y1="344" x2="160" y2="353" stroke="#f6e05e" stroke-width="2" opacity="0.7"/>

  <!-- Suit Lapels -->
  <path d="M116 268 L92 318 L118 332 L147 382 L116 268 Z" fill="#102542"/>
  <path d="M184 268 L208 318 L182 332 L153 382 L184 268 Z" fill="#102542"/>
  <!-- Pocket Square -->
  <polygon points="196,348 214,342 218,352 194,354" fill="#ffffff"/>

  <!-- Ears -->
  <ellipse cx="90" cy="170" rx="10" ry="16" fill="url(#skinN)"/>
  <ellipse cx="210" cy="170" rx="10" ry="16" fill="url(#skinN)"/>

  <!-- Head & Jawline -->
  <path d="M93 136 C93 90, 207 90, 207 136 C207 192, 188 238, 150 242 C112 238, 93 192, 93 136 Z" fill="url(#skinN)"/>

  <!-- Subtle Short Beard / Stubble Shade -->
  <path d="M98 184 C102 222, 126 240, 150 242 C174 240, 198 222, 202 184 C194 206, 176 220, 150 222 C124 220, 106 206, 98 184 Z" fill="#2c353d" opacity="0.16"/>

  <!-- Eyebrows -->
  <path d="M108 145 Q123 139 138 144" fill="none" stroke="#232a31" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M162 144 Q177 139 192 145" fill="none" stroke="#232a31" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="124" cy="160" rx="8.5" ry="6" fill="#ffffff"/>
  <ellipse cx="176" cy="160" rx="8.5" ry="6" fill="#ffffff"/>
  <circle cx="124" cy="160" r="4.6" fill="#2b1d12"/>
  <circle cx="176" cy="160" r="4.6" fill="#2b1d12"/>
  <circle cx="125.5" cy="158.5" r="1.5" fill="#ffffff"/>
  <circle cx="177.5" cy="158.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M150 158 L146 185 Q150 190 156 186" fill="none" stroke="#b9825c" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Neat Mustache & Confident Smile -->
  <path d="M130 198 Q150 191 170 198" fill="none" stroke="#2c353d" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M134 205 Q150 215 166 205" fill="none" stroke="#8c4237" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Men's Classic Side-Part Hair -->
  <path d="M91 154 C86 112, 106 76, 150 76 C194 76, 214 112, 209 154 C205 128, 198 112, 184 106 C164 114, 134 116, 108 108 C98 118, 94 134, 91 154 Z" fill="url(#hairN)"/>
</svg>

